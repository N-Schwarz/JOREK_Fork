name: Welcome New Pull Request

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Thank you for your pull request!

              Please make sure that:
              - ✅ Your branch is up to date with develop, merge or rebase if necessary.
              - ✅ All regression tests pass.
              - ✅ You added at least two reviewers. If you cannot add reviewers, mention one of the contributors in a comment.
              - Only gatekeepers have the right to merge ( N. Schwarz, M. Hoelzl, J. Artola, G. Huijsmans ).
              Make sure at least one of them is aware of the PR.

              Thank you for your contribution!`
            });